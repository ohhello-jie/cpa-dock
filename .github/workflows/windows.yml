name: Windows tests and package

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Run isolated tests
        shell: pwsh
        run: dotnet test tests/CPALauncher.Wpf.Tests/CPALauncher.Wpf.Tests.csproj -c Release --logger "trx;LogFileName=tests.trx" --results-directory artifacts/test-results
      - name: Test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.os }}
          path: artifacts/test-results/*.trx
          if-no-files-found: error
          retention-days: 14

  package:
    needs: test
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify package
        shell: pwsh
        run: ./scripts/publish-win-x64.ps1
      - name: Windows package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CPA-Dock-win-x64-${{ github.sha }}
          path: |
            artifacts/release/CPA-Dock-win-x64-self-contained.zip
            artifacts/release/CPALauncher-win-x64-self-contained.zip
            artifacts/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
